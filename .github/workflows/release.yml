name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Build release
        run: cargo build --release -p displaymanager_cli --target x86_64-pc-windows-msvc

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: displaymanager_cli-windows
          path: target/x86_64-pc-windows-msvc/release/displaymanager_cli.exe

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            displaymanager_cli-windows/displaymanager_cli.exe