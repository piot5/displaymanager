[workspace]
members = [
    "crates/df_core",
    "crates/df_ddc",
    "crates/df_displmgr",
    "crates/df_displmgr_info",
    "apps/displaymanager_cli"
]
resolver = "2"

[workspace.package]
authors = ["piot5"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/piot5/displaymanager"
homepage = "https://github.com/piot5/displaymanager"

[workspace.dependencies]
serde = { version = "1.0.210", features = ["derive"] }
thiserror = { version = "1.0.63" }
rayon = { version = "1.10" }
clap = { version = "4.6.1", features = ["derive"] }
# proptest = "1.4"  # Entfernt - keine Tests vorhanden
windows = { version = "0.58.0", features = ["Win32", "Win32_Devices", "Win32_Devices_Display", "Win32_Graphics", "Win32_Graphics_Gdi", "Win32_System", "Win32_System_Registry", "Win32_Foundation", "Win32_UI", "Win32_UI_HiDpi"] }
libc = { version = "0.2.186" }
criterion = { version = "0.5.1", features = ["async_tokio"] }
env_logger = { version = "0.11" }
# tempfile = { version = "3" }  # Entfernt - nicht verwendet
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
anyhow = "1.0"
drm = "0.12"
wayland-client = "0.31"
wayland-protocols = { version = "0.31", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
log = "0.4"
zbus = { version = "4", features = ["tokio"] }
df_core = { path = "crates/df_core" }
df_ddc = { path = "crates/df_ddc" }
df_displmgr = { path = "crates/df_displmgr" }
df_displmgr_info = { path = "crates/df_displmgr_info" }