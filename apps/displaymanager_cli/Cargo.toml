[package]
name = "displaymanager_cli"
version = "0.1.0"
edition = "2021"
authors = ["piot5"]
description = "Display configuration interface for Windows (GDI/CCD) and Linux (Wayland/DRM)"

[dependencies]
# Workspace-Inheritance für alle Abhängigkeiten
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }

# Interne Crates via Workspace (keine absoluten Pfade mehr)
df_displmgr = { workspace = true }
df_displmgr_info = { workspace = true }
df_ddc = { workspace = true }

# Plattformspezifische Dependencies via Workspace
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
drm = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }