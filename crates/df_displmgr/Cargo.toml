[package]
name = "df_displmgr"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["piot5"]
description = "A unified cross-platform display configuration manager for Windows (CCD/GDI) and Linux (Wayland/wlroots/DRM/KDE/udev)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/piot5/displaymanager"
homepage = "https://github.com/piot5/displaymanager"
documentation = "https://docs.rs/df_displmgr"
readme = "README.md"
keywords = ["display", "monitor", "wayland", "drm", "hdr"]
categories = ["os::windows-apis", "os::linux-apis", "gui"]
exclude = ["/target/", "/Cargo.lock", "*.json", "*.bak", "*.tmp"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "df_displmgr"
path = "src/lib.rs"

[features]
default = ["ctrl_center"]
ctrl_center = []
wgpu_types = []

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }

# Windows-Backends
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

# Linux-Backends
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { workspace = true }
wayland-protocols = { workspace = true, features = ["client"] }
wayland-protocols-wlr = { workspace = true, features = ["client"] }
drm = { workspace = true }
libc = "0.2"
anyhow = { workspace = true }

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
df_displmgr_info = { path = "../df_displmgr_info", version = "0.1.0" }

[[bench]]
name = "display_benchmark"
harness = false